[project]
name = "alphagenome-scn1a"
version = "0.3.0"
description = "Re-scoring ClinVar variants of uncertain significance (VUS) in SCN1A with AlphaGenome to identify novel candidate pathogenic variants for the unsolved fraction of Dravet syndrome."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "rollroyces" },
]
keywords = ["alphagenome", "scn1a", "dravet-syndrome", "variant-prioritization", "rare-disease"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # AlphaGenome SDK (DeepMind, 2025). Pinned as a known-good lower bound;
    # >=0.9 covers the dna_client / variant_scorers / genome APIs we use.
    "alphagenome>=0.9.0",
    # Reference-data + tabular analysis
    "pysam>=0.22",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # Network for NCBI E-utilities (PubMed / ClinVar lookups in Exp 013)
    "requests>=2.32",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "anndata>=0.10",
    # CLI (Typer — lighter than Click, used by the `alphagenome-scn1a` binary)
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
# Lets you do `alphagenome-scn1a <subcommand>` after `pip install -e .`.
# Subcommands: info, tier1, score-gene, score-vcf, reproduce, smoke (legacy), check (legacy).
alphagenome-scn1a = "alphagenome_scn1a.cli:main"

[project.urls]
Repository = "https://github.com/rollroyces/alphagenome-scn1a-pipeline"
HuggingFace = "https://huggingface.co/datasets/RROL/scn1a-vus-alphagenome"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphagenome_scn1a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
